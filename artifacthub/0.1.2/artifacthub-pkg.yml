install: |
  ### From Headlamp

  Open **Plugins** in the Headlamp sidebar, find **Istio**, and click Install.

  ### Desktop app, by hand

  Unpack the release tarball into Headlamp's plugin directory:

  ```sh
  VERSION=0.1.2
  mkdir -p ~/.config/Headlamp/plugins
  curl -fsSL "https://github.com/eottabom/istio-headlamp-plugin/releases/download/v${VERSION}/istio-headlamp-plugin-${VERSION}.tar.gz" \
    | tar xz -C ~/.config/Headlamp/plugins
  ```

  ### From source

  ```sh
  git clone https://github.com/eottabom/istio-headlamp-plugin.git
  cd istio-headlamp-plugin
  npm install && npm run build && npm run package
  ```

  ### Headlamp in a cluster or container

  Unpack the same tarball into the directory Headlamp serves plugins from:

  ```sh
  headlamp -plugins-dir=/headlamp/plugins
  ```

  ### What it needs

  Read access to the Istio CRDs (`networking.istio.io`, `security.istio.io`,
  `telemetry.istio.io`, `extensions.istio.io`), to Gateway API `Gateway` objects, and to
  Namespaces, Services, Pods, Deployments and DaemonSets. Views that cannot read something
  say so rather than guessing.
