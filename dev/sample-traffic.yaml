# Steady traffic for the Traffic Map, one flow per edge kind, and one refused flow:
#   mTLS       shop/loadgen -> shop/orders, web/frontend; legacy/client -> legacy/api (sidecars)
#   plaintext  nomesh/client -> web/frontend (entering: web is PERMISSIVE),
#              shop/loadgen -> nomesh/sink and example.com (leaving)
#   refused    web/frontend -> shop/orders (shop-l4 allows shop and istio-system only);
#              the map does not draw refused connections yet
apiVersion: v1
kind: Namespace
metadata: {name: web, labels: {istio.io/dataplane-mode: ambient}}
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: {name: permissive, namespace: web}
spec: {mtls: {mode: PERMISSIVE}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: web}
spec:
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - {name: app, image: "registry.k8s.io/e2e-test-images/agnhost:2.47", args: [netexec, --http-port=8080]}
        - name: caller
          image: curlimages/curl:8.11.1
          command: [sh, -c, "while true; do curl -s -o /dev/null -m 2 http://orders.shop:8080/; sleep 2; done"]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loadgen, namespace: shop}
spec:
  selector: {matchLabels: {app: loadgen}}
  template:
    metadata: {labels: {app: loadgen}}
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.11.1
          command:
            - sh
            - -c
            - >-
              while true;
              do for u in http://orders.shop:8080/ http://frontend.web:8080/ http://sink.nomesh:8080/ http://example.com/;
              do curl -s -o /dev/null -m 5 "$u"; done; sleep 1; done
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: sink, namespace: nomesh}
spec:
  selector: {matchLabels: {app: sink}}
  template:
    metadata: {labels: {app: sink}}
    spec:
      containers:
        - {name: app, image: "registry.k8s.io/e2e-test-images/agnhost:2.47", args: [netexec, --http-port=8080]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: client, namespace: nomesh}
spec:
  selector: {matchLabels: {app: client}}
  template:
    metadata: {labels: {app: client}}
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.11.1
          command: [sh, -c, "while true; do curl -s -o /dev/null -m 2 http://frontend.web:8080/; sleep 1; done"]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: legacy}
spec:
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - {name: app, image: "registry.k8s.io/e2e-test-images/agnhost:2.47", args: [netexec, --http-port=8080]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: client, namespace: legacy}
spec:
  selector: {matchLabels: {app: client}}
  template:
    metadata: {labels: {app: client}}
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.11.1
          command: [sh, -c, "while true; do curl -s -o /dev/null -m 2 http://api.legacy:8080/; sleep 1; done"]
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: web}
spec: {selector: {app: frontend}, ports: [{name: http, port: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: sink, namespace: nomesh}
spec: {selector: {app: sink}, ports: [{name: http, port: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: legacy}
spec: {selector: {app: api}, ports: [{name: http, port: 8080}]}
