name: 🌐 E2E

# Browser tests against Headlamp on a kind cluster running Istio ambient.
#
# A cluster and a mesh come up first, which costs a few minutes over CI, but
# not enough to leave a pull request unverified until after it merges. Draft
# pull requests are skipped, so work in progress does not stand a cluster up on
# every push; `ready_for_review` is listed because the default event types do
# not include it, and without it a draft turned ready would never be tested.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: browser tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ISTIO_VERSION: 1.30.1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - run: npm ci

      - uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Install istioctl
        run: |
          curl -fsSL https://istio.io/downloadIstio | ISTIO_VERSION="$ISTIO_VERSION" sh -
          echo "$PWD/istio-${ISTIO_VERSION}/bin" >>"$GITHUB_PATH"

      - name: Cluster with Istio ambient
        run: ./dev/kind-istio-ambient.sh

      - name: Wait for sample workloads
        run: kubectl -n shop wait --for=condition=Ready pod --all --timeout=180s

      - name: Install Playwright browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E
        run: ./dev/e2e.sh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
